			shellScript = "VERSION=$(echo $VERSION_INFO_EXPORT_DECL | cut -d- -f1)\nDESTDIR=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\n# Stolen from the `uqmzip` tool\nZIP=\"zip -X -q -n .ogg -8\"\n\ntest -d \"$DESTDIR\" || mkdir -p \"$DESTDIR\"\n\ncase \"$CONFIGURATION\" in\n    *symlink\\ content)\n        echo \"Symlinking content into app bundle...\"\n        test -L \"$DESTDIR/content\" || \\\n            ln -sf \"$SRCROOT/../../content\" \"$DESTDIR/content\"\n        ;;\n    *)\n        echo \"Installing unpackaged files...\"\n        mkdir -p \"$DESTDIR/content/packages\"\n        for x in $SRCROOT/../../content/version\n        do\n            test -d $x || cp $x \"$DESTDIR/content\"\n        done\n        cd \"$SRCROOT/../../content\"\n\n        file=\"$DESTDIR/content/packages/uqm-${VERSION}-content.uqm\"\n        echo \"Creating base content package: $file ...\"\n        test -f \"$file\" && rm \"$file\"\n        $ZIP -r \"$file\" . -x 'addons/*' version $(git diff main..HEAD --name-only | grep content/base | cut -d/ -f3-)\n\n        for x in addons/*\n        do\n            y=`basename $x`\n            file=\"$DESTDIR/content/packages/uqm-${VERSION}-${y}.uqm\"\n            echo \"Creating $y addon package: $file ...\"\n            test -f \"$file\" && rm \"$file\"\n            $ZIP -r \"$file\" \"$x\" -x $(git diff main..HEAD --name-only | grep content | cut -d/ -f3-)\n        done\n        \n        file=\"$DESTDIR/content/packages/uqm-${VERSION_INFO_EXPORT_DECL}-content.uqm\"\n        echo \"Creating Extended Edition content package: $file ...\"\n\t\ttest -f \"$file\" && rm \"$file\"\n\t\t$ZIP -r \"$file\" $(git diff main..HEAD --name-only | grep content | cut -d/ -f3-)\n        ;;\nesac\n";
		};
